name: Melotox
options:
  bundleIdPrefix: com.melotox
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.4"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  Melotox:
    type: application
    platform: iOS
    sources:
      - path: Melotox
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Melotox/Resources/Assets.xcassets
      - path: Melotox/Resources/Audio
        buildPhase: resources
        optional: true
      - path: Melotox/Resources/Fonts
        buildPhase: resources
        optional: true
      - path: Melotox/Resources/Localizable
        buildPhase: resources
    info:
      path: Melotox/Info.plist
      properties:
        CFBundleDisplayName: Melotox
        CFBundleName: Melotox
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melotox.app
        INFOPLIST_FILE: Melotox/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
          SWIFT_OPTIMIZATION_LEVEL: -O
    dependencies: []
    entitlements:
      path: Melotox/Melotox.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.melotox.app

schemes:
  Melotox:
    build:
      targets:
        Melotox: all
    run:
      config: Debug
      simulateLocation: false
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
